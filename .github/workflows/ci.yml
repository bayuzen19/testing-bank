name: Bank PoC quality and documentation
on:
  push:
    branches: [main, bank-agent-e2e]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bank-poc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: banklab
          POSTGRES_PASSWORD: synthetic-lab-only
          POSTGRES_DB: banklab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U banklab -d banklab"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://banklab:synthetic-lab-only@127.0.0.1:5432/banklab
      OLLAMA_NO_CLOUD: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-ci.txt
      - run: npx playwright install --with-deps chromium
      - name: Start ephemeral SonarQube for synthetic public PoC
        run: >-
          docker run -d --name testing-bank-sonar --memory 4g
          -p 9002:9000 -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
          sonarqube@sha256:58b068af30bdfdccf91222de36e310529033e853dfae221b429cba80d10d5751
      - name: Run gates and generate documentation only after success
        run: python scripts/ci.py
      - name: Upload exact-commit release documents
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bank-release-${{ github.sha }}
          path: reports/release/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bank-evidence-${{ github.run_id }}
          path: |
            reports/*.json
            reports/*.log
            coverage/coverage-summary.json
            test-results/**/*.png
          retention-days: 14
      - name: Stop ephemeral scanner
        if: always()
        run: docker rm -f -v testing-bank-sonar || true

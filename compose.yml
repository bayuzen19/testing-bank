name: testing-bank-poc
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: banklab
      POSTGRES_PASSWORD: synthetic-lab-only
      POSTGRES_DB: banklab
    ports:
      - '127.0.0.1:15432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banklab -d banklab']
      interval: 3s
      timeout: 3s
      retries: 20
